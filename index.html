<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ابزار برندینگ عکس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0b0d12; --surface:#151822; --surface-2:#1c202c; --border:#2a2f3d;
    --accent:#4f7bff; --accent-2:#7c5cff; --text:#eef0f5; --text-dim:#9aa1b3;
    --ok-bg:#0d3b2e; --ok-fg:#5eead4; --warn-bg:#3a2a05; --warn-fg:#fbbf24;
    --info-bg:#0f2a4a; --info-fg:#7dc0ff; --danger:#ef4444; --radius:16px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Vazirmatn', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(79,123,255,.15), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(124,92,255,.12), transparent 55%),
      var(--bg);
    color:var(--text); margin:0; padding:14px; line-height:1.6;
  }
  .app{ max-width:480px; margin:0 auto; }
  .app-title{ display:flex; align-items:center; gap:10px; font-size:19px; font-weight:800; margin:4px 0 16px; }
  .app-title .emoji{ font-size:24px; }
  .tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--surface); padding:5px; border-radius:999px; border:1px solid var(--border); }
  .tab-btn{ flex:1; padding:10px 8px; background:transparent; color:var(--text-dim); border:none; border-radius:999px; cursor:pointer; font-size:13.5px; font-weight:600; font-family:inherit; transition:all .18s ease; }
  .tab-btn.active{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 4px 14px rgba(79,123,255,.35); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .card-title{ font-size:13px; font-weight:700; color:var(--text-dim); margin-bottom:10px; }
  select, input[type=text], input[type=number]{ width:100%; padding:11px 12px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; font-size:14px; font-family:inherit; transition:border-color .15s; }
  select:focus, input:focus{ outline:none; border-color:var(--accent); }
  input[type=file]{ width:100%; margin-bottom:6px; color:var(--text-dim); font-size:13px; padding:10px; background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; }
  label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600; }
  button{ padding:12px 16px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border:none; border-radius:12px; cursor:pointer; font-size:14px; font-weight:700; width:100%; font-family:inherit; transition:transform .12s, box-shadow .12s; box-shadow:0 4px 14px rgba(79,123,255,.3); }
  button:hover{ transform:translateY(-1px); }
  button:active{ transform:translateY(0); }
  button.secondary{ background:var(--surface-2); box-shadow:none; border:1px solid var(--border); color:var(--text); }
  button.danger{ background:var(--danger); box-shadow:none; }
  button:disabled{ background:#3a3f4d; cursor:not-allowed; box-shadow:none; transform:none; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }
  .canvas-wrap{
    position:relative; width:100%; overflow:hidden; border-radius:12px;
    background:
      linear-gradient(45deg,#20242f 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(-45deg,#20242f 25%,transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg,transparent 75%,#20242f 75%) 0 0/16px 16px,
      linear-gradient(-45deg,transparent 75%,#20242f 75%) 0 0/16px 16px,
      #15171f;
    touch-action:none; border:1px solid var(--border);
    min-height:160px; display:flex; align-items:center; justify-content:center;
  }
  canvas{ width:100%; display:block; cursor:grab; touch-action:none; }
  canvas:active{ cursor:grabbing; }
  .canvas-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:13px; color:var(--text-dim); padding:20px; background:rgba(11,13,18,.55); }
  .canvas-overlay.error{ color:var(--warn-fg); }
  .canvas-overlay.hidden{ display:none; }
  .thumb-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; margin-top:10px; }
  .thumb-grid canvas{ width:100%; border-radius:10px; border:1px solid var(--border); transition:transform .15s; cursor:default; }
  .thumb-grid canvas:hover{ transform:scale(1.04); border-color:var(--accent); }
  .status{ font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:10px; font-weight:600; }
  .status.ok{ background:var(--ok-bg); color:var(--ok-fg); }
  .status.warn{ background:var(--warn-bg); color:var(--warn-fg); }
  .status.info{ background:var(--info-bg); color:var(--info-fg); }
  .missing-group{ background:var(--warn-bg); border:1px solid #5a4108; border-radius:12px; padding:12px; margin-bottom:10px; font-size:13px; color:#ffe9b3; }
  .missing-group button{ margin-top:8px; }
  .slider-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:4px; font-weight:600; }
  input[type=range]{ width:100%; margin-bottom:12px; accent-color:var(--accent); height:6px; }
  .ready-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .ready-header b{ font-size:13.5px; }
  .ready-header .count{ font-size:12px; color:var(--text-dim); }
  @media (min-width:900px){
    .app{ max-width:960px; }
    #tabPreset[style*="block"], #tabPreset:not([style*="none"]){
      display:grid !important; grid-template-columns:1fr 380px; gap:16px; align-items:start;
    }
    #tabPreset .preset-controls{ order:2; position:sticky; top:14px; }
    #tabPreset .preset-preview{ order:1; }
  }
</style>
</head>
<body>
<div class="app">

<div class="app-title"><span class="emoji">🖼️</span> ابزار برندینگ عکس</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('process')" id="tabBtnProcess">پردازش عکس‌ها</button>
  <button class="tab-btn" onclick="switchTab('preset')" id="tabBtnPreset">ساخت پریست جدید</button>
</div>

<div class="card">
  <label>پروفایل</label>
  <select id="profileSelect" onchange="onProfileChange()">
    <option value="dual">دو-لوگو (رایامدیا)</option>
    <option value="heyat">هیئت (با متن)</option>
  </select>
</div>

<!-- ================= TAB: PROCESS ================= -->
<div id="tabProcess">
  <div class="card">
    <label>آپلود عکس‌ها (چندتایی)</label>
    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(event)">
    <div id="processStatus"></div>
  </div>

  <div class="card" id="batchTextCard" style="display:none;">
    <div class="card-title">متن بنر (برای همه عکس‌های این آپلود)</div>
    <label>متن عنوان (خط اول)</label>
    <input type="text" id="batchTitleInput" placeholder="مثلاً: مراسم عزاداری دهه آخر ماه صفر" oninput="onBatchTextChange()">
    <label>متن تاریخ (خط دوم)</label>
    <input type="text" id="batchDateInput" placeholder="مثلاً: ۲۲ مرداد ۱۴۰۵" oninput="onBatchTextChange()">
  </div>

  <div id="missingPresetsWrap"></div>
  <div id="readyWrap"></div>

  <div class="card" id="downloadCard" style="display:none;">
    <button onclick="downloadAll()">⬇️ پردازش و دانلود همه (ZIP)</button>
  </div>
</div>

<!-- ================= TAB: PRESET CREATION ================= -->
<div id="tabPreset" style="display:none;">
  <div class="preset-preview">
    <div class="card" id="uploadCard">
      <label>عکس نمونه</label>
      <input type="file" id="sampleFileInput" accept="image/*" onchange="loadSampleImage(event)">
      <div id="sampleDims" class="status info" style="display:none;"></div>
    </div>

    <div class="card" id="previewCard" style="display:none;">
      <div class="card-title">پیش‌نمایش — لوگو رو بکش، متن خودکار کنارش می‌شینه</div>
      <div class="canvas-wrap">
        <canvas id="previewCanvas"></canvas>
        <div class="canvas-overlay" id="canvasOverlay">در حال بارگذاری تصویر...</div>
      </div>
    </div>
  </div>

  <div class="preset-controls">
    <div class="card" id="controlsCard" style="display:none;">
      <div class="slider-label"><span>سایز لوگو (کل مجموعه لوگو+متن)</span><span id="scaleVal"></span></div>
      <input type="range" id="scaleSlider" min="5" max="80" value="12" oninput="onScaleChange()">

      <div class="slider-label"><span>سایز متن (مستقل از لوگو)</span><span id="textScaleVal"></span></div>
      <input type="range" id="textScaleSlider" min="50" max="200" value="100" oninput="onTextScaleChange()">

      <div class="slider-label"><span>X لوگو</span><span id="logoXVal"></span></div>
      <input type="range" id="logoXSlider" min="0" max="100" value="50" oninput="onXYChange()">

      <div class="slider-label"><span>Y لوگو</span><span id="logoYVal"></span></div>
      <input type="range" id="logoYSlider" min="0" max="100" value="50" oninput="onXYChange()">

      <div class="slider-label"><span>وینیت دور تصویر</span><span id="vignetteVal"></span></div>
      <input type="range" id="vignetteSlider" min="0" max="100" value="0" oninput="onVignetteChange()">

      <label>نام پریست</label>
      <input type="text" id="presetNameInput" placeholder="مثلاً: افقی موبایل">
      <button onclick="savePreset()">💾 ذخیره پریست</button>
      <div id="saveStatus"></div>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const APPS_SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

const PROFILES = {
  dual:  { name: "دو-لوگو (رایامدیا)", logoPath: "assets/logos/rayamediaa.png", hasText: false },
  heyat: { name: "هیئت (با متن)",       logoPath: "assets/logos/heyat.png",       hasText: true }
};

// همه نسبت‌ها به "ارتفاع لوگو" حساب می‌شن (نه عرض عکس) — یعنی وقتی اسلایدر
// "سایز لوگو" رو عوض می‌کنید، فونت و فاصله‌ها هم به همون نسبت عوض می‌شن،
// دقیقاً مثل یه گروپ فتوشاپ. اسلایدر "سایز متن" یه ضریب اضافه روی همینه که
// فقط خود متن (فونت+فاصله بین دو خط) رو مستقل بزرگ/کوچیک می‌کنه.
const TEXT_STYLE = {
  gapXRatio: 0.1414,     // فاصله افقی لوگو تا متن — نسبت به ارتفاع لوگو (ثابت، به سایز متن ربطی نداره)
  fontRatio: 0.3099,     // سایز فونت پایه — نسبت به ارتفاع لوگو
  lineGapRatio: 0.1191,  // فاصله بین دو خط — نسبت به ارتفاع لوگو
  color: '#ffffff',
  fontFamily: 'Kalameh'
};
const DEMO_TEXT = { title: 'مراسم عزاداری دهه آخر ماه صفر', date: '۲۲ مرداد ۱۴۰۵' };

// دراپ شادو لوگو و متن — فقط از همینجا (کد) تنظیم می‌شه، هیچ کنترلی توی UI نداره
const SHADOW_STYLE = {
  enabled: true,
  color: 'rgba(0,0,0,0.45)',
  blurRatio: 0.006,
  offsetXRatio: 0,
  offsetYRatio: 0.003
};

// ==================== STATE ====================
let currentTab = 'process';
let currentProfile = 'dual';
let presetsCache = {};
let logoImages = {};
let kalamehFont = null;

let uploadedFiles = [];
let groupedReady = {};
let groupedMissing = {};
let batchText = { title: '', date: '' };

let sampleImg = null;
let sampleW = 0, sampleH = 0;
let logoX = 50, logoY = 50, logoScalePct = 12, textScalePct = 100, vignetteIntensity = 0;
let dragging = false;

// ==================== FONT LOADING ====================
async function loadKalamehFont() {
  if (kalamehFont) return kalamehFont;
  try {
    const font = new FontFace('Kalameh', 'url(assets/fonts/Kalameh.ttf)');
    await font.load();
    document.fonts.add(font);
    kalamehFont = font;
  } catch (err) {
    console.error('فونت کلمه لود نشد، از فونت پیش‌فرض استفاده می‌شه:', err);
  }
  return kalamehFont;
}

// ==================== IMAGE LOADING HELPERS ====================
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try { if (img.decode) await img.decode(); } catch (err) {}
      resolve(img);
    };
    img.onerror = () => reject(new Error('خواندن فایل تصویر ناموفق بود: ' + file.name));
    img.src = url;
  });
}

function loadLogoImage(profileKey) {
  return new Promise((resolve) => {
    if (logoImages[profileKey]) return resolve(logoImages[profileKey]);
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = async () => {
      try { if (img.decode) await img.decode(); } catch (err) {}
      const entry = { img, ok: true };
      logoImages[profileKey] = entry;
      resolve(entry);
    };
    img.onerror = () => {
      const entry = { img: null, ok: false };
      logoImages[profileKey] = entry;
      console.error('لوگوی پروفایل "' + profileKey + '" لود نشد. مسیر را بررسی کنید: ' + PROFILES[profileKey].logoPath);
      resolve(entry);
    };
    img.src = PROFILES[profileKey].logoPath;
  });
}

// ==================== INIT ====================
window.onload = async () => {
  await loadKalamehFont();
  loadProfileData(currentProfile);
};

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabProcess').style.display = tab === 'process' ? 'block' : 'none';
  document.getElementById('tabPreset').style.display = tab === 'preset' ? 'block' : 'none';
  document.getElementById('tabBtnProcess').classList.toggle('active', tab === 'process');
  document.getElementById('tabBtnPreset').classList.toggle('active', tab === 'preset');
}

function onProfileChange() {
  currentProfile = document.getElementById('profileSelect').value;
  uploadedFiles = []; groupedReady = {}; groupedMissing = {};
  document.getElementById('processStatus').innerHTML = '';
  document.getElementById('missingPresetsWrap').innerHTML = '';
  document.getElementById('readyWrap').innerHTML = '';
  document.getElementById('downloadCard').style.display = 'none';
  document.getElementById('batchTextCard').style.display = PROFILES[currentProfile].hasText ? 'block' : 'none';
  loadProfileData(currentProfile);
  if (sampleImg) redrawPreview();
}

function onBatchTextChange() {
  batchText.title = document.getElementById('batchTitleInput').value;
  batchText.date = document.getElementById('batchDateInput').value;
  if (uploadedFiles.length) renderReadyPreview();
}

// ==================== PRESET LOADING (cache + sheet) ====================
function loadCachedPresets(profileKey) {
  try {
    const cached = localStorage.getItem('presets_' + profileKey);
    if (cached) { presetsCache[profileKey] = JSON.parse(cached); return true; }
  } catch (err) { console.error("خطا در خواندن کش:", err); }
  return false;
}
function saveCachedPresets(profileKey) {
  try { localStorage.setItem('presets_' + profileKey, JSON.stringify(presetsCache[profileKey])); }
  catch (err) { console.error("خطا در ذخیره کش:", err); }
}
async function fetchPresets(profileKey) {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?profile=${profileKey}`);
    const json = await res.json();
    if (json.success) {
      presetsCache[profileKey] = json.data.map(r => ({ ...r, config: JSON.parse(r.config) }));
      saveCachedPresets(profileKey);
      if (currentTab === 'process' && uploadedFiles.length) groupAndRender();
    }
  } catch (err) {
    console.error("خطا در خواندن پریست‌ها از شیت:", err);
    if (!presetsCache[profileKey]) presetsCache[profileKey] = [];
  }
}
async function loadProfileData(profileKey) {
  await loadLogoImage(profileKey);
  const hadCache = loadCachedPresets(profileKey);
  if (hadCache) { renderProcessStatus(); if (uploadedFiles.length) groupAndRender(); }
  fetchPresets(profileKey);
}

// ==================== API CALLS ====================
async function postToSheet(payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
  });
  return res.json();
}

// ==================== PROCESS TAB ====================
async function handleFiles(e) {
  const files = Array.from(e.target.files);
  uploadedFiles = []; groupedReady = {}; groupedMissing = {};
  document.getElementById('processStatus').innerHTML = '<div class="status info">در حال بارگذاری عکس‌ها...</div>';

  for (const file of files) {
    try {
      const img = await loadImageFromFile(file);
      uploadedFiles.push({ file, img, width: img.naturalWidth, height: img.naturalHeight });
    } catch (err) {
      console.error(err);
    }
  }
  groupAndRender();
}

function groupAndRender() {
  const presets = presetsCache[currentProfile] || [];
  groupedReady = {}; groupedMissing = {};

  uploadedFiles.forEach(item => {
    const key = `${item.width}x${item.height}`;
    const match = presets.find(p => Number(p.width) === item.width && Number(p.height) === item.height);
    if (match) {
      if (!groupedReady[key]) groupedReady[key] = { preset: match, images: [] };
      groupedReady[key].images.push(item);
    } else {
      if (!groupedMissing[key]) groupedMissing[key] = { width: item.width, height: item.height, images: [] };
      groupedMissing[key].images.push(item);
    }
  });

  renderProcessStatus();
  renderMissingPresets();
  renderReadyPreview();
}

function renderProcessStatus() {
  const total = uploadedFiles.length;
  const readyCount = Object.values(groupedReady).reduce((s, g) => s + g.images.length, 0);
  const missingCount = Object.values(groupedMissing).reduce((s, g) => s + g.images.length, 0);
  document.getElementById('processStatus').innerHTML = total ? `
    <div class="status ${missingCount ? 'warn' : 'ok'}">
      ${total} عکس آپلود شد — ${readyCount} آماده پردازش، ${missingCount} بدون پریست
    </div>` : '';
  document.getElementById('downloadCard').style.display = readyCount ? 'block' : 'none';
}

function renderMissingPresets() {
  const wrap = document.getElementById('missingPresetsWrap');
  wrap.innerHTML = '';
  Object.entries(groupedMissing).forEach(([key, group]) => {
    const div = document.createElement('div');
    div.className = 'missing-group';
    div.innerHTML = `
      ⚠️ ${group.images.length} عکس با ابعاد <b>${group.width}×${group.height}</b> پریست ندارند.
      <button class="secondary" onclick='goCreatePresetFor(${group.width}, ${group.height}, ${JSON.stringify(group.images[0].file.name)})'>
        ساخت پریست برای این ابعاد
      </button>`;
    wrap.appendChild(div);
  });
}

function renderReadyPreview() {
  const wrap = document.getElementById('readyWrap');
  wrap.innerHTML = '';
  Object.entries(groupedReady).forEach(([key, group]) => {
    const section = document.createElement('div');
    section.className = 'card';
    section.innerHTML = `<div class="ready-header"><b>${key}</b><span class="count">پریست: ${group.preset.presetName} · ${group.images.length} عکس</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'thumb-grid';
    group.images.forEach(item => {
      const canvas = document.createElement('canvas');
      canvas.width = 150;
      canvas.height = Math.round(150 * (item.height / item.width));
      drawComposite(canvas, item.img, group.preset.config, canvas.width / item.width, batchText);
      grid.appendChild(canvas);
    });
    section.appendChild(grid);
    wrap.appendChild(section);
  });
}

function goCreatePresetFor(w, h, filename) {
  const item = uploadedFiles.find(f => f.width === w && f.height === h && f.file.name === filename);
  if (!item) return;
  switchTab('preset');
  sampleImg = item.img; sampleW = w; sampleH = h;
  logoX = Math.round(w * 0.72); logoY = Math.round(h * 0.30); logoScalePct = 12; textScalePct = 100; vignetteIntensity = 0;
  document.getElementById('sampleDims').style.display = 'block';
  document.getElementById('sampleDims').innerText = `ابعاد نمونه: ${w} × ${h}`;
  document.getElementById('previewCard').style.display = 'block';
  document.getElementById('controlsCard').style.display = 'block';
  document.getElementById('scaleSlider').value = logoScalePct;
  document.getElementById('textScaleSlider').value = textScalePct;
  document.getElementById('vignetteSlider').value = vignetteIntensity;
  redrawPreview();
}

// ==================== DRAWING (shared, defensive) ====================
function applyVignette(ctx, W, H, intensity) {
  if (!intensity) return;
  const strength = Math.min(100, Math.max(0, intensity)) / 100;
  const outerR = Math.sqrt(W * W + H * H) / 2;
  const innerR = outerR * (1 - 0.55 * strength);
  const grad = ctx.createRadialGradient(W / 2, H / 2, innerR * 0.5, W / 2, H / 2, outerR);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, `rgba(0,0,0,${0.75 * strength})`);
  ctx.save();
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawComposite(canvas, photoImg, config, scaleFactor, textLines) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!photoImg || !photoImg.complete || photoImg.naturalWidth === 0) return false;
  ctx.drawImage(photoImg, 0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;
  const shadowBlur = SHADOW_STYLE.blurRatio * W;
  const shadowOffX = SHADOW_STYLE.offsetXRatio * W;
  const shadowOffY = SHADOW_STYLE.offsetYRatio * W;

  const logoEntry = logoImages[currentProfile];
  const lx = config.logoX * scaleFactor;
  const ly = config.logoY * scaleFactor;
  const lw = Math.max(1, config.logoWidth * scaleFactor);
  let lh = lw;

  if (logoEntry && logoEntry.ok && logoEntry.img && logoEntry.img.naturalWidth > 0) {
    const logoImg = logoEntry.img;
    const ratio = logoImg.naturalHeight / logoImg.naturalWidth;
    lh = lw * (isFinite(ratio) ? ratio : 1);
    try {
      if (SHADOW_STYLE.enabled) {
        ctx.save();
        ctx.shadowColor = SHADOW_STYLE.color;
        ctx.shadowBlur = shadowBlur;
        ctx.shadowOffsetX = shadowOffX;
        ctx.shadowOffsetY = shadowOffY;
      }
      ctx.drawImage(logoImg, lx, ly, lw, lh);
      if (SHADOW_STYLE.enabled) ctx.restore();
    } catch (err) { console.error('خطا در رسم لوگو:', err); }
  }

  if (PROFILES[currentProfile] && PROFILES[currentProfile].hasText && textLines && (textLines.title || textLines.date)) {
    const textScale = (config.textScale || 100) / 100;
    const gapX = TEXT_STYLE.gapXRatio * lh;                          // فاصله لوگو-متن: فقط با سایز لوگو عوض می‌شه
    const fontSize = TEXT_STYLE.fontRatio * lh * textScale;          // فونت: هم با لوگو هم با textScale
    const lineGap = TEXT_STYLE.lineGapRatio * lh * textScale;        // فاصله بین خطوط: هم با لوگو هم با textScale

    const textRightX = lx - gapX;
    const logoCenterY = ly + lh / 2;
    const blockHeight = fontSize * 2 + lineGap;
    let cursorY = logoCenterY - blockHeight / 2 + fontSize;

    ctx.textAlign = 'right';
    ctx.direction = 'rtl';
    ctx.fillStyle = TEXT_STYLE.color;
    ctx.font = `${fontSize}px Kalameh, Vazirmatn, sans-serif`;

    if (SHADOW_STYLE.enabled) {
      ctx.shadowColor = SHADOW_STYLE.color;
      ctx.shadowBlur = shadowBlur;
      ctx.shadowOffsetX = shadowOffX;
      ctx.shadowOffsetY = shadowOffY;
    }

    if (textLines.title) ctx.fillText(textLines.title, textRightX, cursorY);
    if (textLines.date) {
      cursorY += lineGap + fontSize;
      ctx.fillText(textLines.date, textRightX, cursorY);
    }

    if (SHADOW_STYLE.enabled) {
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    }
  }

  applyVignette(ctx, W, H, config.vignette || 0);

  return true;
}

// ==================== PRESET CREATION TAB ====================
async function loadSampleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const overlay = document.getElementById('canvasOverlay');
  document.getElementById('previewCard').style.display = 'block';
  document.getElementById('controlsCard').style.display = 'block';
  overlay.classList.remove('hidden', 'error');
  overlay.innerText = 'در حال بارگذاری تصویر...';

  try {
    const img = await loadImageFromFile(file);
    sampleImg = img; sampleW = img.naturalWidth; sampleH = img.naturalHeight;
    logoX = Math.round(sampleW * 0.72); logoY = Math.round(sampleH * 0.30); logoScalePct = 12; textScalePct = 100; vignetteIntensity = 0;
    document.getElementById('sampleDims').style.display = 'block';
    document.getElementById('sampleDims').innerText = `ابعاد نمونه: ${sampleW} × ${sampleH}`;
    document.getElementById('scaleSlider').value = logoScalePct;
    document.getElementById('textScaleSlider').value = textScalePct;
    document.getElementById('vignetteSlider').value = vignetteIntensity;
    redrawPreview();
  } catch (err) {
    overlay.classList.add('error');
    overlay.innerText = '❌ ' + err.message;
  }
}

function currentLogoWidthPx() { return Math.round(sampleW * (logoScalePct / 100)); }

async function redrawPreview() {
  if (!sampleImg) return;
  const canvas = document.getElementById('previewCanvas');
  const overlay = document.getElementById('canvasOverlay');
  canvas.width = sampleW; canvas.height = sampleH;

  const logoEntry = await loadLogoImage(currentProfile);
  const config = { logoX, logoY, logoWidth: currentLogoWidthPx(), textScale: textScalePct, vignette: vignetteIntensity };
  const drew = drawComposite(canvas, sampleImg, config, 1, DEMO_TEXT);

  if (!drew) {
    overlay.classList.remove('hidden'); overlay.classList.add('error');
    overlay.innerText = '❌ عکس نمونه رسم نشد.';
  } else if (!logoEntry.ok) {
    overlay.classList.remove('hidden'); overlay.classList.remove('error');
    overlay.innerText = '⚠️ عکس نمایش داده شد ولی لوگوی پروفایل «' + PROFILES[currentProfile].name + '» لود نشد.\nمسیر مورد انتظار: ' + PROFILES[currentProfile].logoPath;
  } else {
    overlay.classList.add('hidden');
  }

  const xSlider = document.getElementById('logoXSlider');
  const ySlider = document.getElementById('logoYSlider');
  xSlider.max = sampleW; xSlider.value = logoX;
  ySlider.max = sampleH; ySlider.value = logoY;
  document.getElementById('logoXVal').innerText = logoX + 'px';
  document.getElementById('logoYVal').innerText = logoY + 'px';
  document.getElementById('scaleVal').innerText = logoScalePct + '%';
  document.getElementById('textScaleVal').innerText = textScalePct + '%';
  document.getElementById('vignetteVal').innerText = vignetteIntensity + '%';
}

function onScaleChange() { logoScalePct = Number(document.getElementById('scaleSlider').value); redrawPreview(); }
function onTextScaleChange() { textScalePct = Number(document.getElementById('textScaleSlider').value); redrawPreview(); }
function onXYChange() {
  logoX = Number(document.getElementById('logoXSlider').value) || 0;
  logoY = Number(document.getElementById('logoYSlider').value) || 0;
  redrawPreview();
}
function onVignetteChange() {
  vignetteIntensity = Number(document.getElementById('vignetteSlider').value) || 0;
  redrawPreview();
}

// drag support on canvas
function setupDrag() {
  const canvas = document.getElementById('previewCanvas');
  let startX, startY, startLogoX, startLogoY;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scale, y: (clientY - rect.top) * scale };
  }
  function down(e) { dragging = true; const pos = getPos(e); startX = pos.x; startY = pos.y; startLogoX = logoX; startLogoY = logoY; }
  function move(e) {
    if (!dragging) return;
    e.preventDefault();
    const pos = getPos(e);
    logoX = Math.round(startLogoX + (pos.x - startX));
    logoY = Math.round(startLogoY + (pos.y - startY));
    redrawPreview();
  }
  function up() { dragging = false; }
  canvas.addEventListener('mousedown', down);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);
}
setupDrag();

async function savePreset() {
  const name = document.getElementById('presetNameInput').value.trim();
  if (!name) { alert('یه اسم برای پریست وارد کنید'); return; }
  const payload = {
    action: 'save', id: 'p_' + Date.now(), profile: currentProfile, presetName: name,
    width: sampleW, height: sampleH,
    config: { logoX, logoY, logoWidth: currentLogoWidthPx(), textScale: textScalePct, vignette: vignetteIntensity }
  };
  document.getElementById('saveStatus').innerHTML = '<div class="status info">در حال ذخیره...</div>';
  try {
    const result = await postToSheet(payload);
    if (result.success) {
      document.getElementById('saveStatus').innerHTML = '<div class="status ok">✅ پریست ذخیره شد</div>';
      await fetchPresets(currentProfile);
      groupAndRender();
    } else {
      document.getElementById('saveStatus').innerHTML = '<div class="status warn">خطا در ذخیره</div>';
    }
  } catch (err) {
    document.getElementById('saveStatus').innerHTML = '<div class="status warn">خطا در اتصال به شیت</div>';
  }
}

// ==================== BATCH DOWNLOAD ====================
async function downloadAll() {
  const btn = document.querySelector('#downloadCard button');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ در حال ساخت ZIP...';

  try {
    const zip = new JSZip();
    let count = 0;

    for (const [key, group] of Object.entries(groupedReady)) {
      for (const item of group.images) {
        const canvas = document.createElement('canvas');
        canvas.width = item.width;
        canvas.height = item.height;
        drawComposite(canvas, item.img, group.preset.config, 1, batchText);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob null شد')), 'image/jpeg', 0.92);
        });

        zip.file(`output_${++count}_${item.file.name.replace(/\.[^.]+$/, '')}.jpg`, blob);
      }
    }

    if (count === 0) {
      alert('عکس آماده‌ای برای دانلود پیدا نشد.');
      return;
    }

    const content = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(content);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'output.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => {
      URL.revokeObjectURL(url);
    }, 5000);

  } catch (err) {
    alert('❌ خطا در ساخت فایل ZIP:\n' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
